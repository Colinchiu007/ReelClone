# ============================================================
# ReelClone 生产环境 Nginx 配置
# ============================================================
# 功能：
#   1. 80 端口强制重定向到 443（HTTPS）
#   2. 443 端口 SSL 终止（证书占位，需替换为真实证书）
#   3. API 路由分发到 9 个微服务
#   4. WebSocket 路由到 notification-service
#   5. 健康检查端点 /health
#   6. 限流：limit_req_zone 防止突发流量
#   7. 结构化访问日志（JSON 格式）
# ============================================================

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    # ============================================================
    # 基础配置
    # ============================================================
    include /etc/nginx/mime.types;
    default_type application/json;
    charset utf-8;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100m;

    # ============================================================
    # 结构化访问日志（JSON）
    # ============================================================
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"x_request_id":"$http_x_request_id",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ============================================================
    # 限流配置
    # ============================================================
    # 全局限流：每个 IP 10 req/s，突发 20 个请求
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # 登录限流：每个 IP 1 req/s，突发 5 个请求
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
    # 短信验证码限流：每个 IP 1 req/min
    limit_req_zone $binary_remote_addr zone=sms_limit:10m rate=1r/m;
    # 支付回调不限流

    limit_req_status 429;
    limit_conn_status 429;

    # ============================================================
    # 上游服务定义（微服务直连）
    # ============================================================
    upstream auth_service          { server auth-service:3001;          keepalive 16; }
    upstream user_service          { server user-service:3002;          keepalive 16; }
    upstream asset_service         { server asset-service:3003;         keepalive 16; }
    upstream benchmark_service     { server benchmark-service:3004;     keepalive 16; }
    upstream template_service      { server template-service:3005;      keepalive 16; }
    upstream billing_service       { server billing-service:3006;       keepalive 16; }
    upstream workbench_service     { server workbench-service:3007;     keepalive 16; }
    upstream notification_service  { server notification-service:3008;  keepalive 16; }
    upstream order_service         { server order-service:3009;        keepalive 16; }

    # ============================================================
    # 通用 gzip 压缩
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss text/javascript;

    # ============================================================
    # 80 端口：强制重定向到 443
    # ============================================================
    server {
        listen 80;
        server_name _;

        # 健康检查端点（用于容器探针，不走 HTTPS）
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # 其余请求全部 301 到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # 443 端口：HTTPS 主服务
    # ============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ----------------------------------------------------
        # SSL 证书配置（占位，部署时替换为真实证书路径）
        # ----------------------------------------------------
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL 协议与加密套件
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 请求 ID 透传（便于链路追踪）
        proxy_set_header X-Request-Id $request_id;

        # ============================================================
        # 健康检查（聚合端点）
        # ============================================================
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx","ts":"$request_time"}';
            add_header Content-Type application/json;
        }

        # ============================================================
        # auth-service（3001）- 微信登录、JWT 刷新
        # ============================================================
        location ~ ^/api/v1/auth/(login|refresh|wechat-login) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        location /api/v1/auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # ============================================================
        # user-service（3002）- 用户资料、绑定手机号
        # ============================================================
        location /api/v1/users/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://user_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # ============================================================
        # user-service（3002）- 短信验证码（独立限流）
        # ============================================================
        location /api/v1/sms/ {
            limit_req zone=sms_limit burst=3 nodelay;
            proxy_pass http://user_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # ============================================================
        # asset-service（3003）- 资产素材库、OSS STS
        # ============================================================
        location /api/v1/assets/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://asset_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # ============================================================
        # benchmark-service（3004）- 竞品对标解析
        # ============================================================
        location /api/v1/benchmarks/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://benchmark_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # ============================================================
        # template-service（3005）- 模板、推荐、行业偏好
        # ============================================================
        location /api/v1/templates/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://template_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # ============================================================
        # billing-service（3006）- 积分余额、流水
        # ============================================================
        location /api/v1/points/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://billing_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # ============================================================
        # workbench-service（3007）- 生成任务、作品管理
        # ============================================================
        location /api/v1/generations/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://workbench_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        location /api/v1/works/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://workbench_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # ============================================================
        # notification-service（3008）- 通知中心、未读数
        # ============================================================
        location /api/v1/notifications/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://notification_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # ============================================================
        # order-service（3009）- 套餐、订单
        # ============================================================
        location /api/v1/packages/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://order_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        location /api/v1/orders/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://order_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # ============================================================
        # order-service（3009）- 微信支付回调 Webhook（不限流）
        # ============================================================
        location /api/v1/webhooks/ {
            # Webhook 不限流，避免微信支付回调被丢弃
            proxy_pass http://order_service;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # ============================================================
        # WebSocket - notification-service（3008）
        # 用于实时通知推送
        # ============================================================
        location /ws {
            # 不限流，避免长连接被意外断开
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 超时配置
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 60s;

            access_log off;
        }

        # ============================================================
        # 默认 404
        # ============================================================
        location / {
            return 404 '{"code":404,"message":"Not Found","path":"$request_uri"}';
            add_header Content-Type application/json;
        }
    }
}
